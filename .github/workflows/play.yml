# SPDX-License-Identifier: GPL-3.0-only
name: Browser playground
on:
  push:
    branches: [main, codex/browser-playground]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libfribidi0 libraqm0
          python -m pip install Pillow==11.1.0 fonttools==4.66.1
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        with:
          version: '6.0.12'
          actions-cache-folder: emsdk-cache
      - name: Build and exercise the custom firmware in WebAssembly
        run: |
          python tools/build.py --gen-only
          node tools/emu/web/test_keymap.mjs
          CR_VERSION="dev-${GITHUB_SHA::7}" sh tools/emu/web/build_web.sh
          node tools/emu/web/smoke_play.mjs
          python tools/make_play_site.py
          python tools/test_package_cord_release.py
          python tools/package_cord_release.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/play-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: pages
